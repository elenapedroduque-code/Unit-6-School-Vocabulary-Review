<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Unit 6 – School Vocabulary</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #dfe9f3, #ffffff);
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            font-size: 36px;
            margin-bottom: 10px;
        }

        p {
            color: #34495e;
            font-size: 18px;
            margin-bottom: 40px;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 320px;
            padding: 18px 25px;
            background: #4a90e2;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 600;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            transition: 0.25s;
        }

        .btn:hover {
            background: #357ABD;
            transform: translateY(-3px);
            box-shadow: 0 10px 18px rgba(0,0,0,0.20);
        }

        .icon {
            font-size: 26px;
        }
    </style>
</head>
