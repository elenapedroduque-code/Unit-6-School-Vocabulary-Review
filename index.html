<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Unit 6 – School Vocabulary</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;

            /* Fondo tipo pizarra */
            background-image: url('https://i.imgur.com/8fK4h7S.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Capa para que el texto se lea bien */
        .overlay {
            background: rgba(0, 0, 0, 0.55);
            padding: 50px;
            min-height: 100vh;
        }

        h1 {
            color: #ffffff;
            font-size: 42px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        p {
            color: #e0e0e0;
            font-size: 20px;
            margin-bottom: 40px;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 330px;
            padding: 18px 25px;
            background: #4a90e2;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 22px;
            font-weight: 600;
            box-shadow: 0 6px 12px rgba(0,0,0,0.25);
            transition: 0.25s;
        }

        .btn:hover {
            background: #357ABD;
            transform: translateY(-4px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.35);
        }

        .icon {
            font-size: 28px;
        }
    </style>
</head>
<body>

    <div class="overlay">
        <h1>Unit 6 – School Vocabulary</h1>
        <p>Select an activity:</p>

        <div class="container">
            <a class="btn" href="activity1.html">
                <span class="icon">📘</span> Activity 1
            </a>

            <a class="btn" href="activity2.html">
                <span class="icon">✏️</span> Activity 2
            </a>

            <a class="btn" href="activity3.html">
                <span class="icon">🎨</span> Activity 3
            </a>
        </div>
    </div>

</body>
</html>
